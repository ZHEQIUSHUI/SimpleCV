name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            build_type: Release
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: gcc
            build_type: Debug
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            build_type: Release
            cc: clang
            cxx: clang++
          - os: ubuntu-latest
            compiler: clang
            build_type: Debug
            cc: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc
            build_type: Release
          - os: windows-latest
            compiler: msvc
            build_type: Debug
          - os: macos-latest
            compiler: appleclang
            build_type: Release
          - os: macos-latest
            compiler: appleclang
            build_type: Debug

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DSIMPLECV_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  sanitizers:
    name: Linux ASan+UBSan (Debug, clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: clang
          CXX: clang++
          CXXFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: cmake -S . -B build -DSIMPLECV_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  warnings-as-errors:
    name: Linux -Werror (gcc + clang)
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc,   cc: gcc,   cxx: g++     }
          - { name: clang, cc: clang, cxx: clang++ }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: cmake -S . -B build -DSIMPLECV_BUILD_TESTS=ON -DSIMPLECV_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
